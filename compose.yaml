services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avitrack
      POSTGRES_USER: avitrack
      POSTGRES_PASSWORD: avitrack-local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - avitrack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avitrack"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  avitrack-postgres:
